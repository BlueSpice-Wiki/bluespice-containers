name: Sync galaxy to demo

on:
  push:
    branches:
      - galaxy-5.3.x

permissions:
  contents: write

jobs:
  sync-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge into demo
        run: |
          git fetch origin
          git checkout demo
          git pull origin demo
          git merge origin/galaxy-5.3.x --no-edit
          git push origin demo
