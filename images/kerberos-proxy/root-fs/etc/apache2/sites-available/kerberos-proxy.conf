<VirtualHost *:80>
	<Location />
		AllowOverride None
		AuthType GSSAPI
		AuthName "GSSAPI Single Sign On Login"
		GssapiCredStore keytab:/etc/kerberos.keytab
		GssapiBasicAuth On
		GssapiLocalName On
		Require valid-user
	</Location>

	ProxyPass / http://wiki-web:9090/
	ProxyPassReverse / http://wiki-web:9090/

	RequestHeader set X-Remote-User %{GSS_NAME}e
</VirtualHost>
