configs:
  50_xdebug_ini:
    content: |
      ;;; Xdebug configs (uncomment the next line to enable)
      ;zend_extension=xdebug
      ;xdebug.mode=debug,coverage,develop
      ;;; Be careful when using profile mode, as it generates
      ;;; many /tmp/cachegrind.out.xxx files endlessly
      xdebug.start_with_request=1
      xdebug.log=/data/bluespice/logs/xdebug.log
      xdebug.log_level=0
      xdebug.output_dir=/data/bluespice/cache
      ;;; Xdebug client (e.g a component of your IDE)
      xdebug.client_host=host.docker.internal
      xdebug.idekey=VSCODE
      xdebug.client_port=9003
  # Example your-workspace-dir/.vscode/launch.json configuration in this case: 
  # {"configurations":[{"name":"Listen xdebug","type":"php","request":"launch"}]}
  99_dev_overrides_ini:
    content: |
      ;memory_limit = 2048M
      ;opcache.memory_consumption=2048

x-common-dev: &common-dev
  # optionally use certain already-built images from private registry
  # image: docker.bluespice.com/bluespice-qa/wiki:latest
  volumes:
    - ${CODEDIR}:/app/bluespice/w/
  configs:
    - source: 50_xdebug_ini
      target: /etc/php84/conf.d/50-xdebug.ini
    - source: 99_dev_overrides_ini
      target: /etc/php84/conf.d/99-dev-overrides.ini
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DEV_WIKI_DEBUG: 1
  # To enable xdbug and other dev tools, one needs `up -d --build` once
  # The modified image will be applied for wiki-task as well.
  build:
    context: .
    dockerfile_inline: |
      FROM ${BLUESPICE_WIKI_IMAGE} AS bluespice-dev
      USER root
      RUN apk add curl php84-xdebug
      COPY --from=composer:2 /usr/bin/composer /app/bin/composer
      USER bluespice
    no_cache: true

services:
  #wiki-installer:
  #  <<: *common-dev
  wiki-web:
    <<: *common-dev
  wiki-task:
    <<: *common-dev

  # optionally expose database ports for external DB apps:
  # database:
  #   ports:
  #     - "3306:3306"

  # collabpads:
  #   environment:
  #     COLLABPADS_BACKEND_LOG_LEVEL: debug

  # Development containers that starts by defaults
  # - dev-mailhog
  # - dev-dbadmin
  # - dev-searchdashboards
  # - dev-mongodbadmin  

  dev-mailhog:
    image: jcalonso/mailhog:latest
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-mailhog
    ports:
      - "18025:8025"
    environment:
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PORT: 8025
      VIRTUAL_PATH: /_mailhog/
      VIRTUAL_DEST: /

  dev-dbadmin:
    image: phpmyadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-dbadmin
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
      PMA_ABSOLUTE_URI: http://dev-dbadmin/_dbadmin
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PATH: /_dbadmin/
      VIRTUAL_DEST: /

  dev-searchdashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-searchdashboards
    environment:
      # https://github.com/opensearch-project/OpenSearch-Dashboards/blob/main/config/opensearch_dashboards.yml
      SERVER_BASEPATH: /_searchdashboards
      SERVER_REWRITEBASEPATH: true
      OPENSEARCH_HOSTS: '["http://search:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: true
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PORT: 5601
      VIRTUAL_PATH: /_searchdashboards/
      VIRTUAL_DEST: /

  dev-mongodbadmin:
    image: mongo-express
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-mongodbadmin
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://collabpads-database:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""
      ME_CONFIG_SITE_BASEURL: /_mongodbadmin
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PORT: 8081
      VIRTUAL_PATH: /_mongodbadmin/
      VIRTUAL_DEST: /


  # Any service below will be called only when its profile is specified
  # for example: ./bluespice --profile s3 --profile ldap up -d
  # See: https://docs.docker.com/compose/how-tos/profiles/


  # Development containers that will only start/end with profiles
  # Available profiles: sso, keycloak, ldap, s3

  dev-ldap:
    image: osixia/openldap:1.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-ldap
    environment:
      LDAP_ORGANISATION: "Example Com"
      LDAP_DOMAIN: "example.com"
      # login name: cn=admin,dc=example,dc=com
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ${DATADIR}/ldap:/var/lib/ldap
    profiles: [sso, ldap]

  dev-ldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-ldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: dev-ldap
      PHPLDAPADMIN_HTTPS: "false"
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PATH: /_ldapadmin/
      VIRTUAL_DEST: /
    depends_on:
      - dev-ldap
    profiles: [sso, ldap]

  dev-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-keycloak
    command:
      - start-dev
      - --proxy-headers=xforwarded
      - --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${WIKI_HOST}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_URL: https://${WIKI_HOST}/_sso/
      KEYCLOAK_FRONTEND_URL: https://${WIKI_HOST}/_sso/
      KC_HTTP_RELATIVE_PATH: /_sso
      KC_PROXY: edge
      PROXY_ADDRESS_FORWARDING: "true"
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PORT: 8080
      VIRTUAL_PATH: /_sso/
    volumes:
      - ${DATADIR}/keycloak:/opt/keycloak/data
    extra_hosts:
      - "${WIKI_HOST}:host-gateway"
    profiles: [sso, keycloak]

  dev-s3:
    image: minio/minio
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-dev-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DATADIR}/s3:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bioueot}
    command: server /data --console-address ":9001"
    profiles: [s3]

  # Experimental containers that will only start/end with profiles
  # Available profiles: analytics, jobqueuedb, messagebroker, monitoring,
  #   matomo, redis, rabbitmq, grafana, loki, promtail, postgres

  analytics:
    # https://github.com/matomo-org/docker/blob/master/.examples/apache/compose.yml
    #TODO: Configure scriptpath, wire authentication, ...
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-analytics
    # The executing user of this image is root - for production this is not preferrable
    image: matomo:5.7
    restart: always
    volumes:
      - ${DATADIR}/analytics/config:/var/www/html/config
      - ${DATADIR}/analytics/logs:/var/www/html/logs
      # https://plugins.matomo.org/api/2.0/plugins/AjaxOptOut/download/1.5.0
      # $GLOBALS['bsgMatomoBlueSpicePrivacyIntegration'] = true;
      - ${DATADIR}/analytics/plugins/AjaxOptOut:/var/www/html/plugins/AjaxOptOut
      - ${DATADIR}/analytics/user:/var/www/html/user
      # https://github.com/matomo-org/matomo/blob/5.7.0/js/piwik.js
      - ${DATADIR}/analytics/piwik.full.js:/var/www/html/piwik.full.js
    environment:
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_DBNAME : ${DB_NAME}
      MATOMO_DATABASE_HOST: ${DB_HOST}
      MATOMO_DATABASE_PASSWORD: ${DB_PASS}
      MATOMO_DATABASE_TABLES_PREFIX: Matomo_${DB_PREFIX}
      MATOMO_DATABASE_USERNAME: ${DB_USER}
      PHP_MEMORY_LIMIT: 1024M
      # parts relying on docker-compose.proxy.yml
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PORT: 80
      VIRTUAL_PATH: /_matomo/
      VIRTUAL_DEST: /
    # parts relying on the internal database
    depends_on:
        database:
            condition: service_healthy
    profiles: [analytics, matomo]

  jobqueuedb:
    image: redis:6.2
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-jobqueuedb
    volumes:
      - ${DATADIR}/jobqueuedb:/data
    healthcheck:
      test: redis-cli ping
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [jobqueuedb, redis]
    # to enable, wiki-task should depend on a healthy jobqueue db:
    #  wiki-task:
    #    depends_on:
    #      jobqueuedb:
    #        condition: service_healthy
  
  messagebroker:
    image: rabbitmq:3-management
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-messagebroker
    environment:
      RABBITMQ_DEFAULT_USER: ${MESSAGEBROKER_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${MESSAGEBROKER_PASS:-a3robun}
    profiles: [messagebroker, rabbitmq]

  monitoring:
    image: grafana/grafana:7.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-monitoring
    volumes:
      - ${DATADIR}/grafana:/var/lib/grafana
    environment:
      VIRTUAL_HOST: ${WIKI_HOST}
      VIRTUAL_PORT: 3000
      VIRTUAL_PATH: /_monitoring/
      VIRTUAL_DEST: /
    profiles: [monitoring, grafana]

  monitoring-loki:
    image: grafana/loki:2.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-monitoring-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ${DATADIR}/monitoring-loki:/etc/loki
    profiles: [monitoring, loki]

  monitoring-promtail:
    image: grafana/promtail:2.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-monitoring-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ${DATADIR}/monitoring-promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yaml
    profiles: [monitoring, promtail]

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: {$DB_USER}
      POSTGRES_PASSWORD: {$DB_PASS}
      POSTGRES_DB: testdb
    volumes:
      - ${DATADIR}/postgres/data:/var/lib/postgresql/data
    # No ports exposed - only available internally via service name "postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [postgres]

  # Third party service containers that will only start/end with profiles
  # Available profiles: certbotcf
  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    secrets:
      - source: cloudflare_ini
        target: /run/secrets/cloudflare.ini
    volumes:
      - ${DATADIR}/certbot:/etc/letsencrypt
    command: >
      certonly --dns-cloudflare --agree-tos --no-eff-email
      --dns-cloudflare-credentials /run/secrets/cloudflare.ini
      --email ${CERTBOT_CF_EMAIL} --domains *.${CERTBOT_CF_DOMAIN}
    profiles: [certbotcf]

secrets:
  cloudflare_ini:
    file: ${DATADIR}/.secrets/cloudflare.ini
